{# Template base para o painel administrativo #}

<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">

    <title>{% block title %}Painel Admin{% endblock %} - Laços</title>

    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        'lacos-marinho': '#041162',
                        'lacos-marinho-claro': '#1a2380',
                        'lacos-vermelho': '#F23D50',
                        'lacos-azul': '#288ECE',
                        'lacos-verde': '#70C148',
                        'lacos-amarelo': '#FFBC3A',
                        'lacos-vermelho-escuro': '#D62F40',
                        'lacos-azul-escuro': '#1F77B0',
                        'lacos-verde-escuro': '#27590E',
                        'lacos-amarelo-escuro': '#E8A82F',
                        'lacos-vermelho-suave': '#FDE8EB',
                        'lacos-azul-suave': '#E5F1F9',
                        'lacos-verde-suave': '#EAF6E2',
                        'lacos-amarelo-suave': '#FFF4DD',
                        'lacos-marinho-suave': '#E5E7F0',
                    },
                    fontFamily: {
                        'sans': ['Nunito', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
                        'soft-lg': '0 8px 30px rgba(0, 0, 0, 0.08)',
                    }
                }
            }
        }
    </script>
</head>
<body class="font-sans bg-gray-50 text-gray-800 min-h-screen flex flex-col">

    {% block body %}{% endblock %}

    {% block scripts %}{% endblock %}
</body>
</html>
