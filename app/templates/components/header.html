<!--
HEADER PRINCIPAL DO SITE LAÇOS
- Fundo azul marinho (cor institucional do manual)
- Logo à esquerda
- Menu horizontal no desktop
- Menu hambúrguer no mobile
- Submenu de Clubes (hover desktop, toque mobile)
-->
<header class="bg-lacos-marinho shadow-soft sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 md:h-20">

            <!-- LOGO -->
            <a href="{{ url_for('public.home') }}" class="flex items-center hover:opacity-80 transition" aria-label="Página inicial - Associação Laços">
                <img src="{{ url_for('static', filename='img/logo-lacos.png') }}"
                     alt="Logo da Associação Laços"
                     class="h-12 md:h-14 w-auto">
                <span class="text-2xl font-bold text-white"> Laços</span>
            </a>

            <!-- MENU DESKTOP -->
            <nav class="hidden lg:flex items-center gap-1">
                <a href="{{ url_for('public.home') }}"
                   class="px-4 py-2 text-white/90 hover:text-white font-semibold transition">
                    Início
                </a>

                <a href="{{ url_for('public.quem_somos') }}"
                   class="px-4 py-2 text-white/90 hover:text-white font-semibold transition">
                    Quem Somos
                </a>

                <!-- Menu Clubes com submenu (hover) -->
                <div class="relative group">
                    <button class="px-4 py-2 text-white/90 hover:text-white font-semibold transition flex items-center gap-1">
                        Clubes
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Submenu -->
                    <div class="absolute top-full left-0 mt-1 w-56 bg-white rounded-lg shadow-soft-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                        <a href="{{ url_for('public.clubes_lista') }}#infantil"
                           class="block px-4 py-3 text-gray-700 hover:bg-lacos-marinho hover:text-white rounded-t-lg transition">
                            <span class="font-semibold">Clubes Infantis</span>
                            <span class="block text-xs opacity-75">7 unidades</span>
                        </a>
                        <a href="{{ url_for('public.clubes_lista') }}#juvenil"
                           class="block px-4 py-3 text-gray-700 hover:bg-lacos-marinho hover:text-white rounded-b-lg transition border-t border-gray-100">
                            <span class="font-semibold">Clubes Juvenis</span>
                            <span class="block text-xs opacity-75">3 unidades</span>
                        </a>
                    </div>
                </div>

                <a href="{{ url_for('public.eventos_lista') }}"
                   class="px-4 py-2 text-white/90 hover:text-white font-semibold transition">
                    Eventos
                </a>

                <a href="{{ url_for('public.contato') }}"
                   class="px-4 py-2 text-white/90 hover:text-white font-semibold transition">
                    Contato
                </a>

                <!-- Login (Fase 2 - desabilitado visualmente) -->
                <a href="{{ url_for('auth.login') }}"
                   class="inline-flex items-center gap-2 bg-white/10 hover:bg-white/20 backdrop-blur-sm text-white px-4 py-2 rounded-lg font-bold transition border border-white/20">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
                    </svg>
                    Login
                </a>
            </nav>

            <!-- BOTÃO MOBILE -->
            <button id="mobile-menu-button"
                    class="lg:hidden p-2 rounded-lg hover:bg-white/10 transition text-white"
                    aria-label="Abrir menu">
                <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- MENU MOBILE -->
        <nav id="mobile-menu" class="lg:hidden hidden pb-4">
            <a href="{{ url_for('public.home') }}"
               class="block px-4 py-3 text-white/90 hover:bg-white/10 hover:text-white rounded-lg font-semibold transition">
                Início
            </a>
            <a href="{{ url_for('public.quem_somos') }}"
               class="block px-4 py-3 text-white/90 hover:bg-white/10 hover:text-white rounded-lg font-semibold transition">
                Quem Somos
            </a>

            <!-- Submenu Clubes (mobile) -->
            <div>
                <button id="mobile-clubes-button"
                        class="w-full px-4 py-3 text-left text-white/90 hover:bg-white/10 hover:text-white rounded-lg font-semibold transition flex items-center justify-between">
                    Clubes
                    <svg id="mobile-clubes-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div id="mobile-clubes-submenu" class="hidden pl-4">
                    <a href="{{ url_for('public.clubes_lista') }}#infantil"
                       class="block px-4 py-2 text-white/70 hover:text-white transition">
                        Clubes Infantis <span class="text-xs opacity-75">(7)</span>
                    </a>
                    <a href="{{ url_for('public.clubes_lista') }}#juvenil"
                       class="block px-4 py-2 text-white/70 hover:text-white transition">
                        Clubes Juvenis <span class="text-xs opacity-75">(3)</span>
                    </a>
                </div>
            </div>

            <a href="{{ url_for('public.eventos_lista') }}"
               class="block px-4 py-3 text-white/90 hover:bg-white/10 hover:text-white rounded-lg font-semibold transition">
                Eventos
            </a>
            <a href="{{ url_for('public.contato') }}"
               class="block px-4 py-3 text-white/90 hover:bg-white/10 hover:text-white rounded-lg font-semibold transition">
                Contato
            </a>
            <a href="{{ url_for('auth.login') }}"
               class="flex items-center justify-center gap-2 px-4 py-3 mt-2 bg-white/10 hover:bg-white/20 text-white text-center rounded-lg font-bold transition border border-white/30">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 9V5.25A2.25 2.25 0 0 0 13.5 3h-6a2.25 2.25 0 0 0-2.25 2.25v13.5A2.25 2.25 0 0 0 7.5 21h6a2.25 2.25 0 0 0 2.25-2.25V15m3 0 3-3m0 0-3-3m3 3H9"/>
                </svg>
                Login
            </a>
        </nav>
    </div>
</header>
