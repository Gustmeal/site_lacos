<!--
HEADER PRINCIPAL DO SITE LAÇOS
- Logo à esquerda
- Menu horizontal no desktop
- Menu hambúrguer no mobile
- Submenu de Clubes (hover desktop, toque mobile)
-->
<header class="bg-white shadow-soft sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="flex justify-between items-center h-16 md:h-20">

            <!-- LOGO -->
            <a href="{{ url_for('public.home') }}" class="flex items-center gap-2 hover:opacity-80 transition">
                <!-- Placeholder do logo (substituir pelo SVG real depois) -->
                <div class="w-10 h-10 md:w-12 md:h-12 bg-gradient-to-br from-lacos-azul via-lacos-coral to-lacos-mostarda rounded-full flex items-center justify-center text-white font-bold text-lg">
                    L
                </div>
                <span class="text-xl md:text-2xl font-bold text-gray-800">
                    Laços
                </span>
            </a>

            <!-- MENU DESKTOP (escondido em mobile) -->
            <nav class="hidden lg:flex items-center gap-1">
                <a href="{{ url_for('public.home') }}"
                   class="px-4 py-2 text-gray-700 hover:text-lacos-azul font-semibold transition">
                    Início
                </a>

                <a href="{{ url_for('public.quem_somos') }}"
                   class="px-4 py-2 text-gray-700 hover:text-lacos-azul font-semibold transition">
                    Quem Somos
                </a>

                <!-- Menu Clubes com submenu (hover) -->
                <div class="relative group">
                    <button class="px-4 py-2 text-gray-700 hover:text-lacos-azul font-semibold transition flex items-center gap-1">
                        Clubes
                        <svg class="w-4 h-4 transition-transform group-hover:rotate-180" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                        </svg>
                    </button>

                    <!-- Submenu (aparece no hover) -->
                    <div class="absolute top-full left-0 mt-1 w-56 bg-white rounded-lg shadow-soft-lg border border-gray-100 opacity-0 invisible group-hover:opacity-100 group-hover:visible transition-all duration-200">
                        <a href="{{ url_for('public.clubes_lista') }}#infantil"
                           class="block px-4 py-3 text-gray-700 hover:bg-lacos-azul hover:text-white rounded-t-lg transition">
                            <span class="font-semibold">Clube Infantil</span>
                            <span class="block text-xs opacity-75">7 unidades</span>
                        </a>
                        <a href="{{ url_for('public.clubes_lista') }}#juvenil"
                           class="block px-4 py-3 text-gray-700 hover:bg-lacos-azul hover:text-white rounded-b-lg transition border-t border-gray-100">
                            <span class="font-semibold">Clube Juvenil</span>
                            <span class="block text-xs opacity-75">3 unidades</span>
                        </a>
                    </div>
                </div>

                <a href="#eventos"
                   class="px-4 py-2 text-gray-700 hover:text-lacos-azul font-semibold transition">
                    Eventos
                </a>

                <a href="#contato"
                   class="px-4 py-2 text-gray-700 hover:text-lacos-azul font-semibold transition">
                    Contato
                </a>

                <!-- Login (Fase 2 - desabilitado visualmente) -->
                <a href="#"
                   class="ml-4 px-5 py-2 bg-lacos-azul text-white rounded-full hover:bg-lacos-azul-escuro font-semibold transition shadow-soft cursor-not-allowed opacity-50"
                   title="Em breve">
                    Login
                </a>
            </nav>

            <!-- BOTÃO MOBILE (hambúrguer) -->
            <button id="mobile-menu-button"
                    class="lg:hidden p-2 rounded-lg hover:bg-gray-100 transition"
                    aria-label="Abrir menu">
                <svg id="icon-open" class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
                </svg>
                <svg id="icon-close" class="w-6 h-6 hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                </svg>
            </button>
        </div>

        <!-- MENU MOBILE (escondido por padrão, abre via JS) -->
        <nav id="mobile-menu" class="lg:hidden hidden pb-4">
            <a href="{{ url_for('public.home') }}"
               class="block px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg font-semibold transition">
                Início
            </a>
            <a href="{{ url_for('public.quem_somos') }}"
               class="block px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg font-semibold transition">
                Quem Somos
            </a>

            <!-- Submenu Clubes (mobile - toque) -->
            <div>
                <button id="mobile-clubes-button"
                        class="w-full px-4 py-3 text-left text-gray-700 hover:bg-gray-50 rounded-lg font-semibold transition flex items-center justify-between">
                    Clubes
                    <svg id="mobile-clubes-icon" class="w-4 h-4 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
                    </svg>
                </button>
                <div id="mobile-clubes-submenu" class="hidden pl-4">
                    <a href="{{ url_for('public.clubes_lista') }}#infantil"
                       class="block px-4 py-2 text-gray-600 hover:text-lacos-azul transition">
                        Clube Infantil <span class="text-xs opacity-75">(7)</span>
                    </a>
                    <a href="{{ url_for('public.clubes_lista') }}#juvenil"
                       class="block px-4 py-2 text-gray-600 hover:text-lacos-azul transition">
                        Clube Juvenil <span class="text-xs opacity-75">(3)</span>
                    </a>
                </div>
            </div>

            <a href="#eventos"
               class="block px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg font-semibold transition">
                Eventos
            </a>
            <a href="#contato"
               class="block px-4 py-3 text-gray-700 hover:bg-gray-50 rounded-lg font-semibold transition">
                Contato
            </a>
            <a href="#"
               class="block px-4 py-3 mt-2 bg-lacos-azul text-white text-center rounded-lg font-semibold opacity-50 cursor-not-allowed"
               title="Em breve">
                Login (em breve)
            </a>
        </nav>
    </div>
</header>
