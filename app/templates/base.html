<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{% block description %}Associação Laços - Clubes de Brasília. Conhecimento, comunidade e crescimento para crianças e jovens.{% endblock %}">

    <title>{% block title %}Associação Laços - Clubes de Brasília{% endblock %}</title>

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.png') }}">

    <!-- Open Graph / preview ao compartilhar o link (WhatsApp, redes sociais) -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Associação Laços">
    <meta property="og:title" content="{% block og_title %}Associação Laços - Clubes de Brasília{% endblock %}">
    <meta property="og:description" content="{% block og_description %}Conhecimento, comunidade e crescimento para crianças e jovens de Brasília.{% endblock %}">
    <meta property="og:image" content="{{ url_for('static', filename='img/og-image.png', _external=True) }}">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:url" content="{{ request.url }}">
    <meta property="og:locale" content="pt_BR">

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Associação Laços - Clubes de Brasília">
    <meta name="twitter:description" content="Conhecimento, comunidade e crescimento para crianças e jovens de Brasília.">
    <meta name="twitter:image" content="{{ url_for('static', filename='img/og-image.png', _external=True) }}">

    <!-- Cor do tema (barra do navegador no celular) -->
    <meta name="theme-color" content="#041162">

    <!-- Google Fonts: Nunito (acolhedora, moderna, legível) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Configuração customizada do Tailwind com a paleta da Laços -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        // ===== CORES OFICIAIS DA MARCA LAÇOS (manual de marca) =====

                        // Cor institucional principal (azul marinho)
                        'lacos-marinho': '#041162',
                        'lacos-marinho-claro': '#1a2380',

                        // Cores vibrantes do logo
                        'lacos-vermelho': '#F23D50',
                        'lacos-azul': '#288ECE',
                        'lacos-verde': '#70C148',
                        'lacos-amarelo': '#FFBC3A',

                        // Variações para hover/active
                        'lacos-vermelho-escuro': '#D62F40',
                        'lacos-azul-escuro': '#1F77B0',
                        'lacos-verde-escuro': '#27590E',
                        'lacos-amarelo-escuro': '#E8A82F',

                        // Versões suaves (10% opacidade visual) para fundos
                        'lacos-vermelho-suave': '#FDE8EB',
                        'lacos-azul-suave': '#E5F1F9',
                        'lacos-verde-suave': '#EAF6E2',
                        'lacos-amarelo-suave': '#FFF4DD',
                        'lacos-marinho-suave': '#E5E7F0',
                    },
                    fontFamily: {
                        'sans': ['Nunito', 'system-ui', 'sans-serif'],
                    },
                    boxShadow: {
                        'soft': '0 4px 20px rgba(0, 0, 0, 0.05)',
                        'soft-lg': '0 8px 30px rgba(0, 0, 0, 0.08)',
                        'soft-xl': '0 20px 50px rgba(4, 17, 98, 0.15)',
                    }
                }
            }
        }
    </script>

    <!-- CSS customizado adicional -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/custom.css') }}">

    {% block head_extra %}{% endblock %}
</head>

<body class="font-sans bg-white text-gray-800 flex flex-col min-h-screen">

    <!-- HEADER (menu) -->
    {% include 'components/header.html' %}

    <!-- CONTEÚDO PRINCIPAL -->
    <main class="flex-grow">
        {% block content %}{% endblock %}
    </main>

    <!-- FOOTER (rodapé) -->
    {% include 'components/footer.html' %}

    <!-- JavaScript -->
    <script src="{{ url_for('static', filename='js/main.js') }}"></script>

    {% block scripts_extra %}{% endblock %}
</body>
</html>
