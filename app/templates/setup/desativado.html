{% extends 'setup/_base_setup.html' %}
{% block title %}Setup Desativado{% endblock %}

{% block content %}
<div class="text-center mb-8">
    <img src="{{ url_for('static', filename='img/logo-lacos.png') }}"
         alt="Logo Laços"
         class="h-16 w-auto mx-auto mb-4">
</div>

<div class="bg-white rounded-2xl shadow-soft-lg p-8 md:p-10 text-center">

    <div class="inline-flex items-center justify-center w-20 h-20 bg-lacos-azul-suave rounded-2xl mb-4">
        <svg class="w-10 h-10 text-lacos-azul-escuro" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 1 0-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 0 0 2.25-2.25v-6.75a2.25 2.25 0 0 0-2.25-2.25H6.75a2.25 2.25 0 0 0-2.25 2.25v6.75a2.25 2.25 0 0 0 2.25 2.25Z"/>
        </svg>
    </div>

    <h1 class="text-2xl md:text-3xl font-extrabold text-gray-800 mb-2">
        Setup Já Concluído
    </h1>
    <p class="text-gray-600 mb-6">
        Esta página de setup inicial foi desativada porque o sistema já tem administradores cadastrados.
    </p>

    <a href="{{ url_for('admin.login') }}"
       class="inline-flex items-center gap-2 bg-lacos-marinho text-white px-8 py-3 rounded-lg font-bold hover:bg-lacos-marinho-claro transition shadow-soft">
        Ir para o Login
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.5">
            <path stroke-linecap="round" stroke-linejoin="round" d="M13.5 4.5 21 12m0 0-7.5 7.5M21 12H3"/>
        </svg>
    </a>
</div>
{% endblock %}
